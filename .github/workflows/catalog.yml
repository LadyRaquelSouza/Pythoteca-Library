name: Validar catálogo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/validate_public_tree.py
      - run: python -m unittest discover -s tools/media-processing -p 'test_*.py'
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_modules.py
      - run: python scripts/validate_online_manifest.py
